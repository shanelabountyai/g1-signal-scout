[project]
name = "scout"
version = "0.1.0"
description = "Weekly Signal Scout, G1·C: Python + Claude Agent SDK"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.178",
    "feedparser>=6.0.14",
    "pydantic>=2.14.3",
]

[project.scripts]
scout = "scout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
